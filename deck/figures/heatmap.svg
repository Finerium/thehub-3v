    <rect x="215" y="158" width="14" height="14" rx="3"/>
    <rect x="253" y="184" width="14" height="14" rx="3"/>
    <rect x="253" y="210" width="14" height="14" rx="3"/><rect x="443" y="210" width="14" height="14" rx="3"/>
