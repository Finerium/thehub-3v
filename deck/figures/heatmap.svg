    <text x="470" y="250" font-family="IBM Plex Mono" font-size="8.5" fill="#9a5600" text-anchor="end">PARTIAL</text>
  </g>

  <g transform="translate(0,352)" font-family="IBM Plex Mono" font-size="8.5" fill="#67625a">
