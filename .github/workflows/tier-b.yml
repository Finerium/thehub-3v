# Tier B of the golden set (blueprint 9.11, 9.16, 11.7 AC-EVAL-02): the 52 cases whose wording depends on a
# composed answer.
#
#   replay  on a pull request that touches the rule pack, the gates, the prompts or the packed rule pack: the same
#           seeded stack with the gateway serving recordings/ (RECORD_MODE=replay, RECORD_DIR=recordings), so a
#           prompt or pin change forces a reviewed re-recording instead of a quiet drift (9.16).
#   live    nightly and on workflow_dispatch, and on those same pull requests: the provider is called with
#           ZAI_API_KEY, RECORD_DIR is set so the calls are recorded, the recordings are kept as an artifact for
#           the reviewed commit, and the report is ingested into production under CI_INGEST_TOKEN.
#
# The gateway reads RECORD_MODE and RECORD_DIR inside the application, so both are set on the `next start` step and
# not on the runner: setting them on the runner alone would leave a "replay" run calling the provider.
name: Tier B golden set

on:
  schedule:
    - cron: "20 18 * * *" # 01:20 Asia/Jakarta, after the nightly activation of nightly.yml
  workflow_dispatch:
  pull_request:
    paths:
      - "src/rulepack/**"
      - "src/gates/**"
      - "prompts/**"
      - "bundle/rulepack/**"

permissions:
  contents: read

concurrency:
  group: golden-b-${{ github.ref }}
  cancel-in-progress: true

env:
  HARNESS_REF: main
  APP_PORT: "3182"

jobs:
  golden-b:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs both: replay proves the recordings still match, live proves the rule pack and the
        # gates behave on the provider before the merge (blueprint 9.11). A scheduled run is live alone.
        mode: ${{ github.event_name == 'pull_request' && fromJSON('["replay","live"]') || fromJSON('["live"]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thehub
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/thehub
        ports:
          - 4444:4444
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/thehub
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/thehub
      APP_ROLE_PASSWORD: thehub-app-ci-only
      NEON_LOCAL_PROXY: localhost:4444
      NEON_PRELOAD: --import ${{ github.workspace }}/tests/db/neon-local.mjs
      DEMO_ENGINEER_PASSWORD: ${{ secrets.DEMO_ENGINEER_PASSWORD }}
      DEMO_SUPERVISOR_PASSWORD: ${{ secrets.DEMO_SUPERVISOR_PASSWORD }}
      DEMO_MANAGER_PASSWORD: ${{ secrets.DEMO_MANAGER_PASSWORD }}
      CI_INGEST_TOKEN: ${{ secrets.CI_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check out thehub-harness beside the application
        run: |
          harness="$GITHUB_WORKSPACE/../thehub-harness"
          git init -q "$harness"
          git -C "$harness" fetch -q --depth 1 https://github.com/Finerium/thehub-harness.git "$HARNESS_REF"
          git -C "$harness" checkout -q FETCH_HEAD
          git -C "$harness" log -1 --format='harness %H'

      - name: SSH agent with the read-only corpus deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CORPUS_DEPLOY_KEY }}
          log-public-key: false

      - name: Clone the corpus outside the workspace (never inside this repository's tree)
        run: |
          mkdir -p ~/.ssh
          curl -sS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' >> ~/.ssh/known_hosts
          git clone -q --depth 1 git@github.com:Finerium/thehub-corpus.git "$RUNNER_TEMP/thehub-corpus"

      - name: Poppler 26.02.0 (the extractor pin, ADR-005, D-11)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: poppler
          create-args: >-
            -c conda-forge
            poppler=26.02.0
          init-shell: bash
          cache-environment: true

      - name: The extractor build must read 26.02.0
        shell: bash -el {0}
        run: pdftotext -v 2>&1 | head -1 | tee /dev/stderr | grep -F 'pdftotext version 26.02.0'

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Harness environment (uv sync --frozen)
        run: uv sync --frozen --directory "$GITHUB_WORKSPACE/../thehub-harness"

      - name: Cache the pinned embedding model files of the harness (ADR-009)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/../thehub-harness/.cache/models
          key: harness-embedding-model-${{ hashFiles('bundle/embedding_pin.json') }}

      - name: make bundle from the corpus checkout (D-17)
        shell: bash -el {0}
        env:
          CASE1_CORPUS: ${{ runner.temp }}/thehub-corpus/CALIBER-2026_The-Case/Supporting Data/Case 1_ Manufacturing Knowledge Hub
        run: make -C "$GITHUB_WORKSPACE/../thehub-harness" bundle

      - name: Wait for the Neon proxy in front of the service container
        run: |
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null -X POST "http://$NEON_LOCAL_PROXY/sql" -H 'content-type: application/json' \
                 -H "Neon-Connection-String: $DATABASE_URL" --data '{"query":"select 1","params":[]}'; then
              echo "proxy answers after $attempt attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "::error::the Neon proxy at $NEON_LOCAL_PROXY did not answer"; exit 1

      - name: Migrate, create the application role and seed corpus version v1
        env:
          NODE_OPTIONS: ${{ env.NEON_PRELOAD }}
        run: |
          pnpm db:migrate
          pnpm db:app-role
          pnpm db:seed --bundle ../thehub-harness/bundle
          # the demo accounts the cases sign in with
          pnpm db:seed:m0

      - name: The embedder files the ask route traces (ADR-009)
        run: pnpm models:fetch

      - name: Build the application
        run: pnpm build

      # RECORD_DIR is set in both modes: replay reads recordings/, live writes them (9.16, ARCHITECTURE 9.4).
      # ZAI_API_KEY is set in live mode only, so a replay run cannot reach the provider even if a recording misses.
      - name: Start next on ${{ env.APP_PORT }} in ${{ matrix.mode }} mode and wait for /api/health
        env:
          NODE_OPTIONS: ${{ env.NEON_PRELOAD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RECORD_DIR: ${{ github.workspace }}/recordings
          RECORD_MODE: ${{ matrix.mode == 'replay' && 'replay' || 'record' }}
          ZAI_API_KEY: ${{ matrix.mode == 'live' && secrets.ZAI_API_KEY || '' }}
        run: |
          nohup pnpm exec next start -p "$APP_PORT" > "$RUNNER_TEMP/next.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$APP_PORT/api/health" -o "$RUNNER_TEMP/health.json"; then
              jq -r '"health ok, corpus_version \(.corpus_version)"' "$RUNNER_TEMP/health.json"; exit 0
            fi
            sleep 2
          done
          echo "::error::the application did not answer /api/health"; tail -50 "$RUNNER_TEMP/next.log"; exit 1

      # Non-zero when a hard-gated case fails or is skipped. A recording miss fails its case with both hashes named
      # by the gateway's ReplayMismatchError, which is how a prompt or pin change asks for a reviewed re-recording.
      # A scheduled live run's results belong on the production Evaluation page (9.7, actor ci): the cases run
      # against this runner's stack and the report is posted to production. A pull request keeps its results local.
      - name: golden:b (${{ matrix.mode }})
        env:
          PRODUCTION_URL: https://thehub-3v.vercel.app
        run: |
          if [ "${{ matrix.mode }}" = "live" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            pnpm exec tsx scripts/golden/run.ts --tier B --base-url "http://127.0.0.1:$APP_PORT" \
              --out "$RUNNER_TEMP/golden" --ingest --ingest-url "$PRODUCTION_URL"
          else
            pnpm exec tsx scripts/golden/run.ts --tier B --base-url "http://127.0.0.1:$APP_PORT" --out "$RUNNER_TEMP/golden"
          fi

      - name: Keep the report, the summary, the recordings and the application log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: golden-b-${{ matrix.mode }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/golden
            ${{ github.workspace }}/recordings
            ${{ runner.temp }}/next.log
          if-no-files-found: warn
